[package]
name = "bs"
version = "0.1.0"
edition = "2024"
description = "A fast blogsync-compatible CLI tool for Hatena Blog"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client (HTTP/2, async driven via single-thread runtime)
reqwest = { version = "0.12", features = ["rustls-tls", "http2", "gzip"], default-features = false }
tokio = { version = "1", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"

# XML parsing (AtomPub)
quick-xml = { version = "0.37", features = ["serialize"] }

# WSSE authentication
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Date/time
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Directory utilities
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
